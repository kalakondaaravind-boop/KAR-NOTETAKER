<!doctype html>
<!--
  Design preview of KAR Notes on a 1280×800dp tablet. This is NOT a device screenshot: it reproduces the
  Compose layouts (AppShell, HomeScreen, LibraryDrawer, OnboardingScreen, EditorScreen) with the exact
  colour tokens from ui/theme/Theme.kt and the real strings from tools/strings_source.py.
  Note titles shown are sample content. Usage: preview.html?screen=home|drawer|onboarding|editor&theme=light|dark
-->
<html><head><meta charset="utf-8"><title>KAR Notes preview</title>
<style>
:root{--primary:#2A76AD;--onPrimary:#fff;--pc:#CDE7FA;--onPc:#0A2A42;--sc:#DCEAF6;--onSc:#13293C;--tertiary:#5C6BB0;
--bg:#F4F9FE;--on:#13212E;--onV:#3F4D5A;--sv:#DEE8F2;--cLow:#EEF5FC;--c:#E8F1FA;--cHigh:#E1ECF7;--cHighest:#DAE7F4;--outline:#6F7E8C;--outlineV:#C2D0DD;--lowest:#fff;--scrim:rgba(19,33,46,.32);--codeBg:#E6F0F9}
.dark{--primary:#9DD0F7;--onPrimary:#00344F;--pc:#1D4E72;--onPc:#CDE7FA;--sc:#36506A;--onSc:#DCEAF6;--tertiary:#BFC6F5;
--bg:#0E1822;--on:#DCE6F0;--onV:#BCC8D4;--sv:#3C4855;--cLow:#15212C;--c:#192531;--cHigh:#23303C;--cHighest:#2E3B47;--outline:#86939F;--outlineV:#3C4855;--lowest:#09121A;--scrim:rgba(0,0,0,.5);--codeBg:#1A2733}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,Roboto,sans-serif;background:#0b0f14;}
.device{width:1280px;height:800px;background:var(--bg);color:var(--on);position:relative;overflow:hidden;display:flex;flex-direction:column}
.status{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13px;font-weight:500;color:var(--on)}
.main{flex:1;display:flex;min-height:0}
.rail{width:80px;display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:12px;background:var(--bar)}
.ri{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--onV)}
.ri .pill{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.ri.sel .pill{background:var(--sc)}.ri.sel{color:var(--on)}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
.content{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{background:var(--bar);height:80px;display:flex;align-items:center;padding:0 4px 0 4px;gap:4px}
.ib{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--onV);border-radius:24px}
.title{flex:1;padding-left:4px}
.lockup{display:inline-flex;flex-direction:column;gap:2px}
.lockup .row{display:flex;align-items:center}
.lockup .k{font-weight:800;letter-spacing:.03em;color:var(--on)}.lockup .g{font-weight:500;letter-spacing:.09em;color:var(--primary)}
.lockup .tag{color:var(--onV);font-weight:500;letter-spacing:.12em}
.scroll{flex:1;overflow:hidden;display:flex;justify-content:center}
.col{width:720px;max-width:100%}
.capture{display:flex;align-items:center;gap:4px;padding:8px 16px}
.field{background:var(--bg);flex:1;height:56px;border:1px solid var(--outline);border-radius:6px;display:flex;align-items:center;padding:0 16px;color:var(--onV);font-size:16px}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 4px 16px}
.sh h3{margin:0;font-size:14px;font-weight:600;color:var(--primary);letter-spacing:.01em}
.tb{color:var(--primary);font-weight:600;font-size:14px;padding:10px 12px}
.note{padding:12px 16px;display:flex;flex-direction:column;gap:3px}
.note .t{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px}
.note .t svg{width:16px;height:16px;fill:var(--tertiary)}
.note .s{font-size:14px;color:var(--onV);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note .m{font-size:12px;color:var(--onV);display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--outlineV);border-radius:8px;font-size:14px;font-weight:500;color:var(--on)}
.chip svg{width:18px;height:18px;fill:var(--primary)}
.tag2{background:var(--sc);color:var(--onSc);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px}
.task{display:flex;align-items:center;gap:12px;padding:10px 16px}
.cb{width:18px;height:18px;border:2px solid var(--onV);border-radius:3px}
.due{font-size:12px;color:var(--primary);font-weight:600}.over{color:#B3261E}
.dark .over{color:#F2B8B5}
.fab{position:absolute;right:24px;bottom:24px;height:56px;border-radius:16px;display:flex;align-items:center;gap:12px;padding:0 20px 0 16px;font-weight:600;font-size:14px;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.fab svg{fill:var(--onPc)}
.navbar{height:24px}
/* drawer */
.scrim{position:absolute;inset:0;background:var(--scrim)}
.drawer{position:absolute;left:0;top:0;bottom:0;width:300px;background:var(--cLow);border-radius:0 16px 16px 0;padding-top:28px}
.di{display:flex;align-items:center;gap:12px;height:52px;margin:0 12px;padding:0 16px;border-radius:28px;font-size:14px;font-weight:500;color:var(--onV)}
.di.sel{background:var(--sc);color:var(--onSc)}
.hr{height:1px;background:var(--outlineV);margin:8px 24px}
/* onboarding */
.onb{flex:1;display:flex;align-items:center;justify-content:center}
.onbc{width:560px;padding:24px;display:flex;flex-direction:column;gap:16px}
.prog{height:4px;border-radius:2px;background:var(--sv);overflow:hidden}.prog i{display:block;height:100%;width:25%;background:var(--primary)}
.btn{height:40px;border-radius:20px;padding:0 24px;display:inline-flex;align-items:center;font-weight:600;font-size:14px}
.filled{}.text{color:var(--primary)}
/* editor */
.eb{padding:8px 24px;font-size:16px;line-height:26px}
.toolbar{display:flex;gap:2px;padding:6px 8px;background:var(--c);border-radius:28px;margin:0 16px 16px;align-self:center}
.toolbar span{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--onV);border-radius:20px;font-size:15px}
.etb{display:flex;gap:0;padding:4px 4px 0;background:var(--c);height:56px;align-items:center}.etb span{filter:grayscale(1) opacity(.8);width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--onV);font-size:17px;font-weight:600}
.saved{font-size:12px;color:var(--onV);display:flex;align-items:center;gap:4px;padding-right:8px}
.badge{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:rgba(19,33,46,.78);color:#fff;font:600 11px Inter,sans-serif;letter-spacing:.06em;padding:4px 10px;border-radius:10px;z-index:9}

/* ---- 3D glossy layer (mirrors ui/theme/Gloss.kt) ---- */
:root{--gTopP:#2C74A9;--gBotP:#195685;--gSheenP:.18;--gTopPa:#DDF0FD;--gBotPa:#B9DCF5;--gSheenPa:.45;--gTopC:#fff;--gBotC:#EAF3FB;--gSheenC:.6;--gShadow:42,118,173;--gEdgeL:rgba(255,255,255,.85);--gEdgeD:rgba(113,156,192,.28);--onGP:#fff;--onGPa:#0A2A42;--bar:linear-gradient(var(--bg),rgba(205,231,250,.45))}
.dark{--gTopP:#AEDAFA;--gBotP:#85C2EF;--gSheenP:.18;--gTopPa:#285D84;--gBotPa:#174264;--gSheenPa:.12;--gTopC:#22303D;--gBotC:#17232E;--gSheenC:.06;--gShadow:0,0,0;--gEdgeL:rgba(205,231,250,.2);--gEdgeD:rgba(0,0,0,.4);--onGP:#00344F;--onGPa:#CDE7FA;--bar:linear-gradient(var(--bg),rgba(29,78,114,.45))}
.gl{position:relative;overflow:hidden;border:1px solid transparent;background-clip:padding-box}
.gl::before{content:"";position:absolute;left:0;right:0;top:0;height:45%;pointer-events:none;z-index:0}
.gl>*{position:relative;z-index:1}
.gP{background:linear-gradient(var(--gTopP),var(--gBotP));color:var(--onGP);box-shadow:0 3px 6px rgba(var(--gShadow),.35),inset 0 1px 0 var(--gEdgeL),inset 0 -1px 0 var(--gEdgeD)}
.gP::before{background:linear-gradient(rgba(255,255,255,var(--gSheenP)),rgba(255,255,255,0))}
.gPa{background:linear-gradient(var(--gTopPa),var(--gBotPa));color:var(--onGPa);box-shadow:0 4px 10px rgba(var(--gShadow),.28),inset 0 1px 0 var(--gEdgeL),inset 0 -1px 0 var(--gEdgeD)}
.gPa::before{background:linear-gradient(rgba(255,255,255,var(--gSheenPa)),rgba(255,255,255,0))}
.gC{background:linear-gradient(var(--gTopC),var(--gBotC));box-shadow:0 2px 6px rgba(var(--gShadow),.16),0 1px 2px rgba(var(--gShadow),.12),inset 0 1px 0 var(--gEdgeL),inset 0 -1px 0 var(--gEdgeD)}
.gC::before{background:linear-gradient(rgba(255,255,255,var(--gSheenC)),rgba(255,255,255,0))}
.panel{border-radius:20px;margin:8px 16px}
.panel .note+.note,.panel .task+.task{border-top:1px solid color-mix(in srgb,var(--outlineV) 60%,transparent);margin:0 16px;padding-left:0;padding-right:0}
.tiles{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 16px}
.tile{width:86px;border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;text-align:center}
.qbadge{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.qbadge svg{width:22px;height:22px;fill:currentColor}
.fab.gl{position:absolute}
.banner{border-radius:20px;margin:8px 16px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.scrim{z-index:20}.drawer,.dlg{z-index:21}</style></head>

const status=`<div class="status"><span>9:41</span><span>100%</span></div>`;

const note=(t,s,m,o={})=>`<div class="note"><div class="t">${t}${o.pin?`<svg viewBox="0 0 24 24"><path d="${P.pin}"/></svg>`:""}${o.fav?`<svg viewBox="0 0 24 24"><path d="${P.star}"/></svg>`:""}</div><div class="s">${s}</div><div class="m">${m}</div></div>`;

<div class="scroll"><div class="col">

 <div class="panel gl gC"><div class="capture" style="padding:16px 8px 8px 16px"><div class="field">Capture a thought…</div><div class="ib">${ic("mic")}</div><div class="ib" style="opacity:.38">${ic("send")}</div></div>

 <div class="panel gl gC"><div class="sh"><h3>Pinned</h3><span class="tb">See all</span></div>
 ${note("Q4 planning workshop","Agenda, owners and the three decisions we need by Friday…",`Today 09:12 <span class="tag2">planning</span>`,{pin:1})}
 ${note("Supplier comparison","Lead times, MOQ and payment terms for the three shortlisted vendors…",`Yesterday <span class="tag2">procurement</span>`,{pin:1,fav:1})}<div style="height:4px"></div></div>

 <div class="panel gl gC"><div class="sh"><h3>Recent</h3><span class="tb">See all</span></div>
 ${note("Site visit — branch office","Checklist: fire exits ✓, server room temperature, signage…","8 Oct · Operations")}
 ${note("Weekly review","Wins: closed two vendor contracts. Next: hiring plan draft…","6 Oct · Journal")}</div>
</div></div>
<div class="fab gl gPa">${ic("add")}New note</div>`;
const md=t=>`<span style="color:var(--outline)">${t}</span>`;
const editor=()=>`
<div class="topbar"><div class="ib">${ic("back")}</div><div class="title"><span class="saved" style="font-size:14px">${ic("check",18)}Saved</span></div><div class="ib">${ic("undo")}</div><div class="ib" style="opacity:.38">${ic("redo")}</div><div class="ib">${ic("eye")}</div><div class="ib">${ic("more")}</div></div>
<div class="scroll"><div class="col eb">
<div style="font-size:24px;font-weight:600;margin:4px 0 14px">Q4 planning workshop</div>
<div style="font-weight:700">${md("## ")}Agenda</div>
<div>${md("1. ")}Review Q3 outcomes against targets</div><div>${md("2. ")}Agree ${md("**")}<b>three priorities</b>${md("**")} for Q4</div><div>${md("3. ")}Owners and dates for each priority</div>
<div>&nbsp;</div>
<div style="font-weight:700">${md("## ")}Before the session</div>
<div>${md("- [x] ")}<s style="color:var(--onV)">Share last quarter's numbers</s></div>

<div style="color:var(--onV);font-style:italic">${md("> ")}Fewer priorities, clearly owned.</div>
<div>&nbsp;</div>
<div>Related: <span style="color:var(--primary)">[[Supplier comparison]]</span> <span style="color:var(--tertiary)">#planning</span></div>
</div></div>
<div class="etb">${["<b>B</b>","<i>I</i>","<u>U</u>","<s>S</s>","T","☐","•≡","1≡","⇥","⇤","❝","🔗","&lt;/&gt;","{ }","▦","—","📅","🗣","🎙","📎","📷"].map(x=>`<span>${x}</span>`).join("")}</div>`;
const drawer=()=>home()+`<div class="scrim"></div><div class="drawer">

 ${[["inbox","Inbox"],["pin","Pinned"],["star","Favorites"],["folder","Folders"],["label","Tags"],["dash","Templates"],["attach","Attachments"],["hub","Knowledge"],["spark","Ask my notes"]].map(([i,l,s])=>`<div class="di ${s?"sel":""}">${ic(i)}${l}</div>`).join("")}
 <div class="hr"></div>${[["archive","Archive"],["del","Trash"]].map(([i,l])=>`<div class="di">${ic(i)}${l}</div>`).join("")}<div class="hr"></div><div class="di">${ic("settings")}Settings</div>
</div>`;
const aikey=()=>home()+`<div class="scrim"></div><div class="dlg" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;background:var(--cHigh);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 28px rgba(0,0,0,.25)">

 <div style="font-size:12px;color:var(--onV);padding:4px 16px 0">Default: gpt-5.4-mini. You can enter any model your key can use.</div></div>
 <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px"><span class="btn text">Cancel</span><span class="btn filled gl gP">Save and turn on</span></div>
</div>`;
const erase=()=>`<div class="topbar"><div class="ib">${ic("back")}</div><div class="title" style="font-size:22px">Privacy &amp; security</div></div><div class="scroll"><div class="col" style="padding:16px;color:var(--onV)">…</div></div>
<div class="scrim"></div><div class="dlg" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;background:var(--cHigh);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 28px rgba(0,0,0,.25)">
 <div style="display:flex;justify-content:center;color:#B3261E">${ic("warn")}</div>
 <div style="font-size:24px;font-weight:500;text-align:center">Erase all data on this tablet?</div>
 <div style="font-size:14px;color:var(--onV)">This permanently deletes:</div>
 <div style="font-size:14px;line-height:22px">•&nbsp; All notes, folders, tags, templates and version history<br>•&nbsp; All photos, PDFs, voice notes and other attachments<br>•&nbsp; All tasks and their scheduled reminders<br>•&nbsp; Your OpenAI key and the AI request log<br>•&nbsp; All settings, including app lock, search and backup history. The app restarts at the welcome screen.</div>
 <div style="font-size:12px;color:var(--onV)">Backup files you saved elsewhere (Downloads, SD card, USB) are not touched, so you can restore from them later.</div>
 <div style="font-size:14px;font-weight:600;color:#B3261E">This cannot be undone.</div>
 <div style="display:flex;justify-content:flex-end;gap:4px;margin-top:6px"><span class="btn text">Back up first</span><span class="btn text">Cancel</span><span class="btn text" style="color:#B3261E">Continue</span></div>
</div>`;
const onb=()=>`<div class="onb"><div class="onbc">
 <div class="prog"><i></i></div>
 <div style="padding:24px 0;display:flex;justify-content:center">${lockup(64,true)}</div>
 <div style="font-size:24px;font-weight:600">Welcome to KAR Notes</div>
 <div style="font-size:16px;line-height:26px">A calm place to capture anything, write naturally, organise with notebooks and tags, and find things instantly. Notes are written in Markdown, so they stay portable.</div>
 <div style="display:flex;align-items:center;margin-top:8px"><span style="flex:1"></span><span class="btn text">Skip</span><span class="btn filled gl gP">Next</span></div>
</div></div>`;
const isRail=screen==="home"||screen==="drawer"||screen==="aikey";
document.getElementById("app").innerHTML=`<div class="device ${theme}">${status}<div class="main">${isRail&&screen!=="drawer"?rail:""}<div class="content">${({home,editor,drawer,aikey,erase,onboarding:onb})[screen]()}</div></div><div class="navbar"></div></div>`;
if(screen==="aikey"||screen==="erase"){const c=document.querySelector(".device");c.appendChild(c.querySelector(".scrim"));c.appendChild(c.querySelector(".dlg"));}
if(screen==="drawer"){document.querySelector(".main").insertAdjacentHTML("afterbegin","");document.querySelector(".content").insertAdjacentHTML("beforebegin",rail);
 const c=document.querySelector(".device"); const s=c.querySelector(".scrim"),d=c.querySelector(".drawer"); c.appendChild(s); c.appendChild(d);}
</script></body></html>
