# Builds KAR Notes, runs the tests, and captures real screenshots on a tablet emulator
# (welcome, hidden OpenAI setup, home, library, editor, dark mode, settings - see tools/ci-ui-tour.sh).
# Results appear under the run's "Artifacts": kar-notes-debug-apk and tablet-screenshots.
name: Android build

on:
  push:
    branches-ignore: ['ci-logs-*']
  pull_request:
  workflow_dispatch:

permissions:
  # contents: write lets CI publish logs and screenshots to the ci-logs-* branches (never touches main).
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Domain unit tests (product rules, search, templates, backup, AI policy)
        run: ./gradlew --no-daemon :core:domain:test

      - name: Build debug APK
        shell: bash
        run: |
          mkdir -p ci-out
          set -o pipefail
          ./gradlew --no-daemon --continue :app:assembleDebug 2>&1 | tee ci-out/build.log

      - name: Show build errors on the run page
        if: failure()
        run: bash tools/ci-annotate.sh ci-out/build.log

      - name: Checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kar-notes-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
        continue-on-error: true

      - name: Publish build log to the ci-logs-build branch
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -E '^e: |error: |^\* What went wrong' -A2 ci-out/build.log > ci-out/errors.txt 2>/dev/null || true
          cp -r app/build/outputs/apk/debug ci-out/apk 2>/dev/null || true
          bash tools/ci-publish.sh ci-out ci-logs-build

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  tablet:
    name: "Tablet emulator - install, screenshot, instrumented tests"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: kar-notes-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on a Pixel Tablet emulator (API 34, offline)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          # The emulator's network is switched off to prove the app works with no connection.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p screenshots
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell settings put system user_rotation 1
            adb install -r apk/*.apk
            bash tools/ci-ui-tour.sh screenshots
            adb shell dumpsys package com.kargroup.notetaker.debug | grep -i "android.permission" > screenshots/granted-permissions.txt || true
            adb logcat -d -b crash > screenshots/crash-log.txt || true
            ./gradlew --no-daemon connectedDebugAndroidTest > screenshots/instrumented-tests.log 2>&1 || echo "instrumented tests failed - see instrumented-tests.log" > screenshots/instrumented-tests-FAILED.txt

      - name: Publish screenshots to the ci-logs-tablet branch
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p screenshots/test-reports
          cp -r app/build/reports/androidTests screenshots/test-reports/app 2>/dev/null || true
          cp -r core/data/build/reports/androidTests screenshots/test-reports/core-data 2>/dev/null || true
          bash tools/ci-publish.sh screenshots ci-logs-tablet

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tablet-screenshots
          path: screenshots/

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: "**/build/reports/androidTests/"
          if-no-files-found: ignore
