# Builds KAR Notes, runs the tests, and captures real screenshots on a tablet emulator
# (welcome, hidden OpenAI setup, home, library, editor, dark mode, settings - see tools/ci-ui-tour.sh).
# Results appear under the run's "Artifacts": kar-notes-debug-apk and tablet-screenshots.
name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Domain unit tests (product rules, search, templates, backup, AI policy)
        run: ./gradlew --no-daemon :core:domain:test

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kar-notes-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
        continue-on-error: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  tablet:
    name: "Tablet emulator - install, screenshot, instrumented tests"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: kar-notes-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on a Pixel Tablet emulator (API 34, offline)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          # The emulator's network is switched off to prove the app works with no connection.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p screenshots
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell settings put system user_rotation 1
            adb install -r apk/*.apk
            bash tools/ci-ui-tour.sh screenshots
            adb shell dumpsys package com.kargroup.notetaker.debug | grep -i "android.permission" > screenshots/granted-permissions.txt || true
            adb logcat -d -b crash > screenshots/crash-log.txt || true
            ./gradlew --no-daemon connectedDebugAndroidTest || echo "instrumented tests failed - see reports" > screenshots/instrumented-tests-FAILED.txt

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tablet-screenshots
          path: screenshots/

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: "**/build/reports/androidTests/"
          if-no-files-found: ignore
